name: Deploy Flask to flask_app

on:
  push:
    branches:
      - main  # or master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- 1. SYNC FLASK CODE ---
      - name: Deploy Flask Backend to flask_app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps                      # Forces FTPS/Explicit TLS (required by GoDaddy)
          security: ftps
        #   passive: true                       # Prevents firewall timeouts/hanging
          local-dir: ./
          server-dir: ./flask_app/
          exclude: |
            **/.git**
            **/.github**
            **/venv/**
            **/__pycache__/**
            **/.env
            **/tmp/**

      # --- 2. RESTART PASSENGER ENGINE ---
      - name: Trigger Passenger Reload
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: ftps
          passive: true
          local-dir: ./tmp/
          server-dir: ./flask_app/tmp/