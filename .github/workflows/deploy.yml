name: Deploy Flask to flask_app

on:
  push:
    branches: [ api ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository using v4 actions
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Sync Flask Backend files (excluding ALL .git subfolders)
      - name: Sync to flask_app
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_USERPASSWORD }}
          local-dir: ./
          server-dir: ./flask_app/
          exclude: |
            **/.git
            **/.git/**
            **/.github
            **/.github/**
            **/venv
            **/venv/**
            **/__pycache__
            **/__pycache__/**
            **/.env
            **/.env*

      # 3. Create local tmp directory and restart.txt on the runner
      - name: Create local tmp folder
        run: |
          mkdir -p ./tmp
          touch ./tmp/restart.txt

      # 4. Sync restart file to force Passenger reload
      - name: Restart Passenger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_USERPASSWORD }}
          local-dir: ./tmp/
          server-dir: ./flask_app/tmp/